name: Build and release bundles

# Push a tag (e.g. "v1.0") whenever you cross a milestone -- that's the only thing that
# triggers a real release. Nothing runs on ordinary pushes to main, so this never eats CI
# minutes (or your attention) on routine commits. workflow_dispatch exists only as a manual
# "run it right now" escape hatch (e.g. to test the pipeline itself), and publishes a release
# tagged by run number instead of a version, so it can never collide with a real tag release.
#
# Three independent jobs, one per platform, all publishing to the SAME release (see the
# race-tolerant publish step each one runs: whichever job finishes first creates the release,
# the others upload their own file into it instead of failing).
#
# Linux: builds docs/BUILD.md's own recipe end to end (system deps -> clone Emacs ->
# ./build.sh all -> packages -> grammars -> dist linux) on a stock ubuntu-latest runner.
#
# macOS: builds this config's own real recipe (brew install emacs-plus@31 -> packages ->
# grammars -> dist macos) on a stock macos-latest (Apple Silicon) runner. tools/dist-macos.sh
# fully relocates Emacs.app (every Homebrew dylib it needs, plus its lisp/etc/libexec trees,
# copied inside Contents/ and relinked with dylibbundler) so the result needs no Homebrew and
# no compiling on the machine that unzips it -- verified directly by running the built bundle
# with its own source Homebrew keg renamed out of the way first. See docs/DISTRIBUTION.md.
#
# Windows: reuses test.yml's own test-windows job recipe (that job already builds this exact
# bundle, via WSL on windows-latest, to test it -- Vampire/setup-wsl sets up WSL since
# tools/dist-windows.sh itself needs it, compiling packages by running the real downloaded
# Windows Emacs through cmd.exe/WSL interop). This job just publishes the same build instead
# of only testing it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo libgnutls28-dev libncurses-dev \
            libxml2-dev libjansson-dev libsqlite3-dev libtree-sitter-dev libgccjit-13-dev \
            libgtk-3-dev librsvg2-dev libjpeg-dev libtiff-dev libgif-dev libwebp-dev \
            liblcms2-dev libharfbuzz-dev libcairo2-dev libxpm-dev libotf-dev \
            p7zip-full python3-venv

      # git:// first, matching docs/BUILD.md; https:// as a fallback since some networks
      # (this one may well be one of them) block the unencrypted git protocol.
      - name: Fetch Emacs source
        run: |
          git clone --depth=1 git://git.savannah.gnu.org/emacs.git emacs-src || \
          git clone --depth=1 https://git.savannah.gnu.org/git/emacs.git emacs-src

      - name: Build this Emacs (configure + make + install + prune)
        run: ./build.sh all

      - name: Install this config's Elisp packages
        run: ./build.sh packages

      - name: Build the tree-sitter grammars
        run: ./build.sh grammars

      - name: Build the Linux portable bundle
        run: ./build.sh dist linux

      - name: Publish to the GitHub release (race-tolerant: another platform's job may win the create)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="manual-run-${GITHUB_RUN_NUMBER}"
            git tag "$TAG" 2>/dev/null || true
            git push origin "$TAG" 2>/dev/null || true
          fi
          gh release create "$TAG" \
            dist/custom-emacs-linux-x86_64.tar.gz \
            dist/custom-emacs-linux-x86_64.zip \
            --title "$TAG" \
            --generate-notes \
          || gh release upload "$TAG" \
            dist/custom-emacs-linux-x86_64.tar.gz \
            dist/custom-emacs-linux-x86_64.zip \
            --clobber

  build-and-release-macos:
    # Pinned, not "macos-latest": GitHub's "latest" label tracks whatever macOS is newest right
    # now, and Homebrew's current emacs-plus bottle for it can set a minimum-OS requirement
    # (LC_BUILD_VERSION's minos, confirmed directly with otool -l) newer than this project's own
    # target Mac actually runs -- caught for real: a "macos-latest" build set minos 26.0 and
    # failed outright ("can't use this version of the application... with this version of
    # macOS") on a real MacBook Pro running macOS 15.7.3. Match this to that Mac's own major
    # version (`sw_vers`), not the newest thing GitHub happens to offer today.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs (emacs-plus@31: native compilation, tree-sitter, a real Cocoa GUI) and build tools
        run: |
          brew tap d12frosted/emacs-plus
          brew trust d12frosted/emacs-plus
          brew install emacs-plus@31 dylibbundler ripgrep fd dua-cli git-delta cmake libtool automake

      - name: Install this config's Elisp packages
        run: EMACS="$(brew --prefix emacs-plus@31)/bin/emacs" ./build.sh packages

      - name: Build the tree-sitter grammars
        run: EMACS="$(brew --prefix emacs-plus@31)/bin/emacs" ./build.sh grammars

      # vterm's native module needs an explicit CMake build the first time (package.el's own
      # install step does not trigger it); without this the module is simply missing and
      # vterm falls back to erroring when actually used, same as on a machine with no CMake.
      - name: Build vterm's native module
        run: |
          d="$(echo config/elpa/vterm-*)"
          cmake -S "$d" -B "$d/build"
          cmake --build "$d/build"

      - name: Build the macOS portable bundle
        run: ./build.sh dist macos

      - name: Publish to the GitHub release (race-tolerant: another platform's job may win the create)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="manual-run-${GITHUB_RUN_NUMBER}"
            git tag "$TAG" 2>/dev/null || true
            git push origin "$TAG" 2>/dev/null || true
          fi
          gh release create "$TAG" \
            dist/custom-emacs-macos-arm64.zip \
            --title "$TAG" \
            --generate-notes \
          || gh release upload "$TAG" \
            dist/custom-emacs-macos-arm64.zip \
            --clobber

  build-and-release-windows:
    # Reuses test.yml's own test-windows job recipe almost verbatim (see that job's own
    # comments for the full reasoning on each step) -- it already builds this exact bundle
    # for real, on real Windows, via WSL, to test it; this job just publishes that same
    # build instead of only testing it. No caching here (unlike test.yml): a release should
    # reflect exactly this commit, built fresh, not a reused zip from a different one.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Windows runners default to core.autocrlf=true, which corrupts the shell-wrapper
      # script Vampire/setup-wsl's wsl-bash shell type generates for every run: step below
      # (a literal CRLF ends up inside it) -- must be disabled before checkout, since
      # autocrlf converts line endings AT checkout time.
      - name: Disable autocrlf (corrupts the WSL shell-wrapper scripts otherwise)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: "Set up WSL (tools/dist-windows.sh needs it: it compiles packages by running the real downloaded Windows Emacs through cmd.exe/WSL interop)"
        uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: p7zip-full unzip wget python3-venv python3-pip emacs-nox

      - name: Install this config's Elisp packages
        shell: wsl-bash {0}
        run: EMACS=/usr/bin/emacs ./build.sh packages

      - name: Build the Windows portable bundle
        shell: wsl-bash {0}
        env:
          CI: "true"
        run: ./build.sh dist windows

      - name: "Publish to the GitHub release (race-tolerant: another platform's job may win the create)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # unset WSLENV -- same reasoning as test.yml's own matching step: once
          # Vampire/setup-wsl has registered a real WSL distro, a bare `git`/`gh` lookup
          # could resolve through WSL's own PATH translation instead of this job's own
          # native Windows tools, and WSLENV would try to translate this step's PATH as
          # if it were still Windows' own semicolon-separated, backslash-style PATH.
          unset WSLENV
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="manual-run-${GITHUB_RUN_NUMBER}"
            git tag "$TAG" 2>/dev/null || true
            git push origin "$TAG" 2>/dev/null || true
          fi
          gh release create "$TAG" \
            dist/custom-emacs-windows-x64.zip \
            --title "$TAG" \
            --generate-notes \
          || gh release upload "$TAG" \
            dist/custom-emacs-windows-x64.zip \
            --clobber
