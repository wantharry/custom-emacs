name: Test (Linux + Windows)

# Runs the full regression suite on real Linux and real Windows, automatically, on every
# push to main/utilities/java (plus any PR into them) -- found worth having the hard way:
# a real, user-reported bug (the bundled `pass' password-manager script could never run on
# Windows, since `file-executable-p' only recognizes .exe/.bat/.cmd/.com there) that no
# amount of testing on this project's own Linux/WSL dev sandbox could ever have caught,
# because the bug was in how Windows itself treats a plain shebang script -- a genuinely
# different OS, not a config mistake. workflow_dispatch exists as a manual "run it now"
# escape hatch (e.g. to try this workflow itself without waiting for a push).
#
# The Linux job mirrors release.yml's own proven build recipe (docs/BUILD.md end to end).
# The Windows job needs WSL -- tools/dist-windows.sh itself requires it (see that script's
# own top comment: it compiles packages by running the real downloaded Windows Emacs
# through cmd.exe/WSL interop, the same way building the Windows dist locally in this
# project's own WSL2 dev sandbox always has) -- so `Vampire/setup-wsl' sets one up on the
# `windows-latest' runner first. Once the bundle is built, the actual test run against it
# happens on the NATIVE Windows side (plain `bash' from the runner's already-installed Git
# for Windows), not through WSL and not through Wine -- this is genuinely real Windows, the
# same OS class the bug above only showed up on.

on:
  push:
    branches: [main, utilities, java]
  pull_request:
    branches: [main, utilities, java]
  workflow_dispatch: {}

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          # `libtool-bin', not just `libtool': on Debian/Ubuntu the `libtool' package is
          # only the m4 macros/`libtoolize'/docs --- the actual `/usr/bin/libtool' script
          # that vterm's own CMakeLists.txt shells out to build its vendored libvterm
          # comes from the separate `libtool-bin' package, confirmed directly (`dpkg -S
          # /usr/bin/libtool' on a machine with both installed). `libtool' alone being
          # "already the newest version" in an earlier run's log was a red herring: the
          # package existed, but the actual command still wasn't on PATH, which is
          # exactly why every vterm test kept failing even after adding it.
          sudo apt-get install -y build-essential texinfo libgnutls28-dev libncurses-dev \
            libxml2-dev libjansson-dev libsqlite3-dev libtree-sitter-dev libgccjit-13-dev \
            libgtk-3-dev librsvg2-dev libjpeg-dev libtiff-dev libgif-dev libwebp-dev \
            liblcms2-dev libharfbuzz-dev libcairo2-dev libxpm-dev libotf-dev \
            p7zip-full python3-venv cmake libtool libtool-bin

      # Real optional tools some tests exercise for real rather than skip around (the
      # same "don't break the basics" spirit as everything else in this workflow) ---
      # found missing the hard way, the first real run of this suite on a fresh runner:
      # `rustup' (already on ubuntu-latest) ships a `rust-analyzer' stub that errors
      # until the component is added, exactly what langs/rust-analyzer-component-is-
      # installed already checks for; `dua' (config/disk-usage.el's own backend, `C-c
      # W') is not on this runner at all, same version tools/dist-windows.sh bundles.
      - name: Install rust-analyzer and dua (real optional tools some tests need)
        run: |
          rustup component add rust-analyzer
          curl -fsSL "https://github.com/Byron/dua-cli/releases/download/v2.45.1/dua-v2.45.1-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          sudo install /tmp/dua-v2.45.1-x86_64-unknown-linux-musl/dua /usr/local/bin/dua

      - name: Fetch Emacs source
        run: |
          git clone --depth=1 git://git.savannah.gnu.org/emacs.git emacs-src || \
          git clone --depth=1 https://git.savannah.gnu.org/git/emacs.git emacs-src
          echo "EMACS_SRC_REV=$(git -C emacs-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache the Emacs build tree
        uses: actions/cache@v4
        with:
          path: |
            build
            install
          key: linux-build-${{ env.EMACS_SRC_REV }}-${{ hashFiles('build.sh') }}

      - name: Build this Emacs (configure + make + install + prune)
        run: ./build.sh all

      - name: Install this config's Elisp packages
        run: ./build.sh packages

      # `vterm-module-compile' normally runs lazily, the first time a real user's own
      # `(require 'vterm)' needs it (see tests/ert/vterm.el's own comment) --- fine for an
      # interactive user compiling once on their own machine, but it writes its real
      # compiler output to an Emacs buffer, not stdout, so a build failure there during
      # the test run earlier showed up as nothing more informative than a generic
      # `file-missing' on `vterm-module', with no way to see the real `cmake'/`make'
      # error behind it. Doing it here explicitly, printing that buffer unconditionally,
      # gives CI the same real visibility a local terminal already has.
      - name: Compile vterm's native module (visible output, not hidden in a buffer)
        run: |
          ./install/bin/emacs --batch --eval "
          (progn
            (dolist (d (directory-files \"config/elpa\" t \"^[^.]\"))
              (when (file-directory-p d) (add-to-list 'load-path d)))
            (condition-case err
                (progn (setq vterm-always-compile-module t) (require 'vterm) (vterm-module-compile)
                       (princ (with-current-buffer vterm-install-buffer-name (buffer-string))))
              (error (princ (with-current-buffer vterm-install-buffer-name (buffer-string)))
                     (princ (format \"\nvterm-module-compile failed: %S\n\" err))
                     (kill-emacs 1))))"

      # tools/dist-windows.sh needs config/elpa to already exist (it compiles THOSE
      # packages for the real Windows Emacs itself, later, in its own pipeline) --- the
      # Windows job below reuses this instead of building its own Emacs from source a
      # second time just to populate the same package source files again.
      - name: Upload the installed packages for the Windows job to reuse
        uses: actions/upload-artifact@v4
        with:
          name: elpa
          path: config/elpa
          retention-days: 1

      - name: Build the tree-sitter grammars
        run: ./build.sh grammars

      - name: Run the full test suite
        run: ./build.sh test

  test-windows:
    needs: test-linux
    # Only the uploaded elpa artifact (an EARLIER step) is actually needed from the
    # Linux job --- a later test failure there should not also skip this one, or every
    # real Windows signal would be hostage to the Linux suite being 100% green first.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      # Windows runners default to core.autocrlf=true, which corrupts the shell-wrapper
      # script `Vampire/setup-wsl''s `wsl-bash' shell type generates for every `run:'
      # step below (a literal CRLF ends up inside it, so `/usr/bin/env' sees the command
      # name "bash\r", not "bash", and fails outright) --- found the hard way, this
      # workflow's own first real run; the documented fix for exactly this is disabling
      # it before checkout, not after (autocrlf converts line endings AT checkout time).
      - name: Disable autocrlf (see comment above)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Download the packages the Linux job already installed
        uses: actions/download-artifact@v4
        with:
          name: elpa
          path: config/elpa

      - name: Set up WSL (tools/dist-windows.sh needs it -- see its own top comment)
        uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-22.04
          additional-packages: p7zip-full unzip wget python3-venv python3-pip

      - name: Build the Windows dist bundle (same recipe as building it locally)
        shell: wsl-bash {0}
        run: ./build.sh dist windows

      # The real end-user launch goes through `Emacs.exe' (tools/windows-launcher.c), which
      # prepends the bundled tools (dua, rg, fd, delta, git) to PATH and sets
      # `CUSTOM_EMACS_HOME' before ever starting the real `emacs.exe' --- confirmed directly
      # in that launcher's own source, first real run of this suite against actual Windows:
      # `my/disk-usage' (`dua') and `my/pass' (its bundled shell) both depend on exactly
      # this. That launcher is GUI-only (starts `runemacs.exe' detached, no stdout to
      # capture), so it cannot drive `--batch' tests itself; this replicates its PATH/env
      # setup by hand instead, so the test run sees what the real shipped product does.
      - name: Run the full test suite against the real Windows build
        shell: bash
        env:
          EMACS: ${{ github.workspace }}\dist\stage\custom-emacs-windows-x64\emacs\bin\emacs.exe
          CUSTOM_EMACS_HOME: ${{ github.workspace }}\dist\stage\custom-emacs-windows-x64
        run: |
          STAGE="${CUSTOM_EMACS_HOME//\\//}"
          export PATH="$STAGE/tools/git/cmd:$STAGE/tools/git/usr/bin:$STAGE/tools/rg:$STAGE/tools/fd:$STAGE/tools/delta:$STAGE/tools/dua:$PATH"
          ./build.sh test
